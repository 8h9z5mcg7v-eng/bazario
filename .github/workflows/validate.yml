name: Validate BAZARIO draft
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/supabase-auth-scaffold]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bazario_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bazario_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate frontend, SQL structure and test coverage
        run: node scripts/validate.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply migrations and run PostgreSQL smoke tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: bazario_test
        run: |
          psql --set ON_ERROR_STOP=1 --file tests/postgres/supabase_stub.sql
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
          psql --set ON_ERROR_STOP=1 --file supabase/verify_installation.sql
          psql --set ON_ERROR_STOP=1 --file tests/postgres/smoke.sql
