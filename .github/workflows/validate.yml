name: Validate BAZARIO draft
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/supabase-auth-scaffold]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate frontend and SQL migration structure
        run: node scripts/validate.mjs
